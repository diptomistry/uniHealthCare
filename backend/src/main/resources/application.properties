spring.application.name=uniMed

# Server configuration
server.port=8000

# Database configuration (set via environment variables — see .env.example)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/uni_health}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate settings
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jackson.serialization.fail-on-empty-beans=false

springdoc.swagger-ui.path=/api-docs
springdoc.api-docs.path=/v3/api-docs

# Docker compose configuration
spring.docker.compose.enabled=false
spring.ai.retry.max-attempts=10
spring.ai.retry.backoff.initial-interval=2000
spring.ai.retry.backoff.multiplier=5
spring.ai.retry.backoff.max-interval=180000
spring.ai.retry.on-client-errors=false
spring.ai.retry.exclude-on-http-codes=
spring.ai.retry.on-http-codes=

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Vertex AI Gemini (optional)
spring.ai.vertex.ai.gemini.project-id=${VERTEX_AI_PROJECT_ID:}
spring.ai.vertex.ai.gemini.location=${VERTEX_AI_LOCATION:LOCATION}
spring.ai.vertex.ai.gemini.chat.options.model=vertex-pro-vision
spring.ai.vertex.ai.gemini.chat.options.temperature=0.5

logging.level.org.springframework.security=INFO

# OpenAI (set OPENAI_API_KEY in the environment)
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-3.5-turbo
spring.ai.openai.chat.options.temperature=0.7
openai.api.key=${OPENAI_API_KEY}

# JWT (set JWT_SECRET in the environment)
jwt.secret=${JWT_SECRET}

# Multipart file configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.location=public/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads
server.url=${SERVER_URL:http://localhost:8000}
